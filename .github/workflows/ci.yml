name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests

      - name: Syntax-check integration
        run: python -m py_compile custom_components/xhome/*.py custom_components/xhome/api/*.py src/xhome/*.py tests/*.py
