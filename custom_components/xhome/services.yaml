refresh:
  name: Refresh
  description: Refresh XHome cloud data for this integration.

list_devices:
  name: List devices
  description: Return loaded XHome devices with full uid values for use in other XHome actions.
  fields:
    config_entry_id:
      selector:
        text:

get_screen_light_config:
  name: Get screen light config
  description: Return the screen-light configuration for one XHome device.
  fields:
    uid:
      required: true
      selector:
        text:
    config_entry_id:
      selector:
        text:

get_app_lock_status:
  name: Get app lock status
  description: Return XHome app lock/unlock status for a brand/model/sdk tuple.
  fields:
    brand:
      default: python
      selector:
        text:
    model:
      default: xhome-api
      selector:
        text:
    sdk:
      default: 35
      selector:
        number:
          mode: box
    config_entry_id:
      selector:
        text:

set_unlock_type:
